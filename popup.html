<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Luna cool girl</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
  <style>
    :root {
      /* Material 3 Dark Theme Colors */
      --md-sys-color-primary: #D0BCFF;
      --md-sys-color-on-primary: #381E72;
      --md-sys-color-primary-container: #4F378B;
      --md-sys-color-on-primary-container: #EADDFF;
      --md-sys-color-secondary: #CCC2DC;
      --md-sys-color-on-secondary: #332D41;
      --md-sys-color-secondary-container: #4A4458;
      --md-sys-color-on-secondary-container: #E8DEF8;
      --md-sys-color-error: #F2B8B5;
      --md-sys-color-on-error: #601410;
      --md-sys-color-error-container: #8C1D18;
      --md-sys-color-on-error-container: #F9DEDC;
      --md-sys-color-background: #141218;
      --md-sys-color-on-background: #E6E0E9;
      --md-sys-color-surface: #141218;
      --md-sys-color-on-surface: #E6E0E9;
      --md-sys-color-surface-variant: #49454F;
      --md-sys-color-on-surface-variant: #CAC4D0;
      --md-sys-color-outline: #938F99;
      --md-sys-color-outline-variant: #49454F;
      
      /* Surface Tones */
      --md-sys-color-surface-container-lowest: #0F0D13;
      --md-sys-color-surface-container-low: #1D1B20;
      --md-sys-color-surface-container: #211F26;
      --md-sys-color-surface-container-high: #2B2930;
      --md-sys-color-surface-container-highest: #36343B;
      
      /* Elevations */
      --md-elevation-1: 0 1px 2px 0 rgba(0, 0, 0, 0.3), 0 1px 3px 1px rgba(0, 0, 0, 0.15);
      --md-elevation-2: 0 1px 2px 0 rgba(0, 0, 0, 0.3), 0 2px 6px 2px rgba(0, 0, 0, 0.15);
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      width: 100%;
      height: 100vh;
      background-color: var(--md-sys-color-background);
      color: var(--md-sys-color-on-background);
      font-family: 'Roboto', sans-serif;
      overflow: hidden;
      font-size: 14px;
      line-height: 1.5;
    }
    
    .container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      padding: 14px;
      gap: 10px;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 2px;
      flex-shrink: 0;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }
    .logo-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .logo-title {
      font-size: 17px;
      font-weight: 500;
      color: var(--md-sys-color-on-background);
      letter-spacing: 0.1px;
    }
    .logo-sub {
      font-size: 12px;
      color: var(--md-sys-color-on-surface-variant);
      letter-spacing: 0.4px;
      margin-top: 2px;
    }

    /* Page Bar - Cyber Minimalist */
    .page-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, rgba(33, 31, 38, 0.95), rgba(25, 23, 30, 0.95));
      padding: 6px 10px 6px 8px;
      border-radius: 12px;
      font-size: 12px;
      color: var(--md-sys-color-on-surface-variant);
      border: 1px solid rgba(208, 188, 255, 0.15);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      overflow: hidden;
      flex-shrink: 0;
      transition: all 0.2s ease;
      cursor: pointer;
      user-select: none;
    }
    .page-bar:hover {
      border-color: rgba(208, 188, 255, 0.35);
      box-shadow: 0 4px 14px rgba(124, 58, 237, 0.2);
      background: linear-gradient(135deg, rgba(43, 41, 48, 0.98), rgba(33, 31, 38, 0.98));
    }
    .page-sec-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 8px;
      background: rgba(168, 229, 163, 0.12);
      color: #A8E5A3;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }
    .page-sec-badge.insecure {
      background: rgba(242, 184, 181, 0.12);
      color: var(--md-sys-color-error);
    }
    .page-sec-badge .material-symbols-rounded {
      font-size: 14px;
    }
    .page-url-wrapper {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
    }
    .page-domain {
      font-family: 'Roboto', sans-serif;
      font-weight: 600;
      color: var(--md-sys-color-primary);
      font-size: 12.5px;
      letter-spacing: 0.2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex-shrink: 1;
    }
    .page-path-sep {
      color: var(--md-sys-color-outline);
      font-size: 11px;
      opacity: 0.6;
      flex-shrink: 0;
    }
    .page-path {
      font-family: 'Roboto Mono', monospace;
      color: var(--md-sys-color-on-surface-variant);
      font-size: 11px;
      opacity: 0.9;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex-shrink: 2;
      background: rgba(255, 255, 255, 0.05);
      padding: 1px 7px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .copy-url-btn {
      background: transparent;
      border: none;
      color: var(--md-sys-color-outline);
      width: 24px;
      height: 24px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s ease;
      padding: 0;
    }
    .copy-url-btn:hover {
      background: rgba(208, 188, 255, 0.15);
      color: var(--md-sys-color-primary);
    }
    .copy-url-btn:active {
      transform: scale(0.9);
    }
    .copy-url-btn .material-symbols-rounded {
      font-size: 14px;
    }
    .copy-url-btn.copied {
      color: #A8E5A3;
      background: rgba(168, 229, 163, 0.2);
    }

    /* Log Area */
    .log-area {
      background-color: var(--md-sys-color-surface-container);
      border-radius: 16px;
      padding: 14px;
      overflow-y: auto;
      flex: 1;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .log-area::-webkit-scrollbar { width: 8px; } /* 6 -> 8 */
    .log-area::-webkit-scrollbar-thumb { background: var(--md-sys-color-outline-variant); border-radius: 8px; }
    
    .log-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 15px; /* 12 -> 15 */
      color: var(--md-sys-color-on-surface-variant);
      text-align: center;
      flex: 1;
      padding: 25px; /* 20 -> 25 */
    }
    .log-empty-icon {
      font-size: 36px; /* 32 -> 40 */
      color: var(--md-sys-color-secondary);
    }
    .log-empty-title {
      font-size: 16px; /* 14 -> 18 */
      font-weight: 500;
      color: var(--md-sys-color-on-surface);
    }
    .log-empty-subtitle {
      font-size: 14px; /* 12 -> 15 */
      font-family: 'Roboto Mono', monospace;
      opacity: 0.8;
    }
    
    .log-entry {
      display: flex;
      gap: 15px; /* 12 -> 15 */
      font-size: 14px; /* 13 -> 16 */
      animation: slidein 0.2s ease-out;
    }
    @keyframes slidein {
      from { opacity: 0; transform: translateY(5px); } /* 4 -> 5 */
      to { opacity: 1; transform: translateY(0); }
    }
    .log-dot {
      width: 10px; /* 8 -> 10 */
      height: 10px; /* 8 -> 10 */
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 8px; /* 6 -> 8 */
    }
    .log-entry.user .log-dot { background-color: var(--md-sys-color-primary); }
    .log-entry.agent .log-dot { background-color: var(--md-sys-color-secondary); }
    .log-entry.action .log-dot { background-color: #A8E5A3; }
    .log-entry.error .log-dot { background-color: var(--md-sys-color-error); }
    .log-entry.info .log-dot { background-color: var(--md-sys-color-tertiary); }
    
    .log-content { flex: 1; line-height: 1.5; }
    .log-label {
      font-size: 11px; /* 10 -> 12 */
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px; /* 0.5 -> 0.6 */
      color: var(--md-sys-color-on-surface-variant);
      margin-bottom: 3px; /* 2 -> 3 */
    }
    .log-entry.user .log-content { color: var(--md-sys-color-primary); }
    .log-entry.agent .log-content { color: var(--md-sys-color-on-surface); }
    .log-entry.action .log-content { color: #A8E5A3; font-family: 'Roboto Mono', monospace; font-size: 14px; /* 12 -> 15 */ }
    .log-entry.error .log-content { color: var(--md-sys-color-error); }
    .log-entry.info .log-content { color: var(--md-sys-color-tertiary); font-family: 'Roboto Mono', monospace; font-size: 14px; /* 12 -> 15 */ }

    /* Answer Card Component */
    .log-entry.answer-card {
      background: linear-gradient(135deg, rgba(79, 55, 139, 0.4), rgba(33, 31, 38, 0.8));
      border: 1px solid rgba(208, 188, 255, 0.35);
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      animation: slidein 0.2s ease-out;
    }
    .answer-card-header {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--md-sys-color-primary);
    }
    .answer-card-icon {
      font-size: 18px;
      color: #A8E5A3;
    }
    .answer-option-text {
      font-family: 'Roboto Mono', monospace;
      font-size: 14px;
      font-weight: 600;
      color: #FFFFFF;
      background: rgba(0, 0, 0, 0.35);
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      word-break: break-word;
    }
    .answer-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 2px;
    }
    .answer-status-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 8px;
    }
    .answer-status-tag.success {
      background: rgba(168, 229, 163, 0.15);
      color: #A8E5A3;
    }
    .answer-status-tag.warning {
      background: rgba(242, 184, 181, 0.15);
      color: var(--md-sys-color-error);
    }
    .manual-select-btn {
      background: linear-gradient(135deg, #7C3AED, #6366F1);
      color: #FFFFFF;
      border: none;
      border-radius: 8px;
      padding: 5px 11px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
      font-family: 'Roboto', sans-serif;
    }
    .manual-select-btn:hover {
      background: linear-gradient(135deg, #8B5CF6, #4F46E5);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.45);
    }
    .manual-select-btn:active {
      transform: scale(0.96);
    }
    .manual-select-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* Thinking */
    .thinking {
      display: none;
      align-items: center;
      gap: 15px; /* 12 -> 15 */
      padding: 15px 20px; /* 12,16 -> 15,20 */
      background-color: var(--md-sys-color-surface-container-high);
      border-radius: 15px; /* 12 -> 15 */
      font-size: 14px; /* 13 -> 16 */
      color: var(--md-sys-color-primary);
      font-weight: 500;
    }
    .thinking.active { display: flex; }
    .thinking-dots { display: flex; gap: 5px; /* 4 -> 5 */ }
    .thinking-dots span {
      display: inline-block;
      width: 8px; /* 6 -> 8 */
      height: 8px; /* 6 -> 8 */
      background-color: var(--md-sys-color-primary);
      border-radius: 50%;
      animation: bounce 1.4s ease-in-out infinite;
    }
    .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
    .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.6; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* Remove Chrome / Webkit number input spinners */
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type=number] {
      -moz-appearance: textfield;
    }

    /* Quick actions */
    .quick-actions {
      display: flex;
      gap: 12px;
    }
    .quick-btn {
      flex: 1;
      font-size: 14px;
      font-weight: 500;
      padding: 12px 16px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
      font-family: 'Roboto', sans-serif;
    }
    .quick-btn .material-symbols-rounded {
      font-size: 20px;
    }

    .answer-all-btn {
      background: linear-gradient(135deg, #7C3AED, #6366F1);
      color: #FFFFFF;
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
    }
    .answer-all-btn:hover {
      background: linear-gradient(135deg, #8B5CF6, #4F46E5);
      box-shadow: 0 6px 16px rgba(124, 58, 237, 0.45);
      transform: translateY(-1px);
      color: #FFFFFF;
    }

    .answer-current-btn {
      background-color: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface);
      border: 1px solid var(--md-sys-color-outline-variant);
    }
    .answer-current-btn:hover {
      background-color: var(--md-sys-color-surface-variant);
      border-color: var(--md-sys-color-primary);
      color: var(--md-sys-color-primary);
      transform: translateY(-1px);
    }

    .q-range-container {
      display: flex;
      gap: 15px;
      margin-bottom: 5px;
    }
    .q-input-group {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .q-label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-left: 4px;
      padding-right: 2px;
    }
    .q-input-group label {
      font-size: 12px;
      font-weight: 500;
      color: var(--md-sys-color-on-surface-variant);
      letter-spacing: 0.2px;
    }
    .detect-btn {
      background: rgba(208, 188, 255, 0.08);
      border: 1px solid var(--md-sys-color-outline-variant);
      color: var(--md-sys-color-primary);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 2px 7px;
      border-radius: 8px;
      transition: all 0.2s ease;
      font-family: 'Roboto', sans-serif;
    }
    .detect-btn .material-symbols-rounded {
      font-size: 13px;
    }
    .detect-btn:hover {
      background-color: rgba(208, 188, 255, 0.18);
      border-color: var(--md-sys-color-primary);
    }
    .detect-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .q-input-group input {
      background-color: var(--md-sys-color-surface-container-high);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: 14px;
      color: var(--md-sys-color-on-surface);
      font-family: 'Roboto Mono', monospace;
      font-size: 14px;
      padding: 11px 16px;
      outline: none;
      transition: all 0.2s;
    }
    .q-input-group input:focus {
      border-color: var(--md-sys-color-primary);
      box-shadow: 0 0 0 2px rgba(208, 188, 255, 0.25);
    }

    /* Input */
    .input-row {
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }
    textarea {
      flex: 1;
      background-color: var(--md-sys-color-surface-container-high);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: 18px;
      color: var(--md-sys-color-on-surface);
      font-family: 'Roboto', sans-serif;
      font-size: 15px;
      padding: 14px 18px;
      resize: none;
      outline: none;
      line-height: 1.5;
      max-height: 150px;
      min-height: 56px;
      transition: all 0.2s;
    }
    textarea::placeholder { color: var(--md-sys-color-on-surface-variant); opacity: 0.7; }
    textarea:focus {
      border-color: var(--md-sys-color-primary);
      box-shadow: 0 0 0 2px rgba(208, 188, 255, 0.25);
    }
    .send-btn {
      width: 56px;
      height: 56px;
      border-radius: 18px;
      border: none;
      background: linear-gradient(135deg, #7C3AED, #6366F1);
      color: #FFFFFF;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(124, 58, 237, 0.35);
      transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
      flex-shrink: 0;
    }
    .send-btn .material-symbols-rounded {
      font-size: 26px;
      color: #FFFFFF;
    }
    .send-btn:hover {
      background: linear-gradient(135deg, #8B5CF6, #4F46E5);
      box-shadow: 0 6px 20px rgba(124, 58, 237, 0.5);
      transform: translateY(-1px);
    }
    .send-btn:active {
      transform: translateY(0) scale(0.96);
    }
    .send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      background: var(--md-sys-color-surface-container-high);
      box-shadow: none;
      transform: none;
    }
    .send-btn:disabled .material-symbols-rounded {
      color: var(--md-sys-color-on-surface-variant);
    }

    /* Footer */
    .footer {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding-top: 10px; /* 8 -> 10 */
    }

    .stop-btn {
      background-color: var(--md-sys-color-error-container);
      color: var(--md-sys-color-on-error-container);
      border: none;
      padding: 10px 20px; /* 8,16 -> 10,20 */
      border-radius: 25px; /* 20 -> 25 */
      font-size: 14px; /* scaled */
      font-weight: 500;
      cursor: pointer;
      display: none;
      align-items: center;
      gap: 8px; /* 6 -> 8 */
      transition: background-color 0.2s;
      font-family: 'Roboto', sans-serif;
    }
    .stop-btn.visible { display: flex; }
    .stop-btn:hover { background-color: #F9DEDC; }

    .clear-btn {
      font-size: 14px; /* 12 -> 15 */
      font-weight: 500;
      color: var(--md-sys-color-primary);
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px 15px; /* 6,12 -> 8,15 */
      border-radius: 25px; /* 20 -> 25 */
      transition: background-color 0.2s;
      font-family: 'Roboto', sans-serif;
    }
    .clear-btn:hover {
      background-color: rgba(208, 188, 255, 0.08); /* primary hover */
    }

    /* Header Actions */
    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .keys-btn {
      background-color: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface);
      border: 1px solid var(--md-sys-color-outline-variant);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      font-family: 'Roboto', sans-serif;
    }
    .keys-btn:hover {
      background-color: var(--md-sys-color-surface-variant);
      border-color: var(--md-sys-color-primary);
    }
    .keys-badge {
      background-color: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 10px;
      min-width: 18px;
      text-align: center;
    }

    /* Modal Overlay & Card */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      animation: fadeIn 0.2s ease-out;
    }
    .modal-overlay.active {
      display: flex;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .modal-card {
      background-color: var(--md-sys-color-surface-container-low);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: 24px;
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      animation: popIn 0.25s cubic-bezier(0.2, 0, 0, 1);
    }
    @keyframes popIn {
      from { transform: scale(0.92); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
      background-color: var(--md-sys-color-surface-container);
    }
    .modal-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      font-weight: 500;
      color: var(--md-sys-color-on-surface);
    }
    .modal-title-icon {
      color: var(--md-sys-color-primary);
      font-size: 22px;
    }
    .keys-count-tag {
      font-size: 12px;
      background-color: var(--md-sys-color-surface-container-highest);
      color: var(--md-sys-color-on-surface-variant);
      padding: 3px 9px;
      border-radius: 12px;
      font-weight: 500;
    }
    .icon-btn-close {
      background: none;
      border: none;
      color: var(--md-sys-color-on-surface-variant);
      cursor: pointer;
      border-radius: 50%;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s;
    }
    .icon-btn-close:hover {
      background-color: var(--md-sys-color-surface-variant);
      color: var(--md-sys-color-on-surface);
    }

    .modal-body {
      padding: 18px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .modal-body::-webkit-scrollbar { width: 6px; }
    .modal-body::-webkit-scrollbar-thumb { background: var(--md-sys-color-outline-variant); border-radius: 6px; }

    /* Add Key Form */
    .add-key-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: var(--md-sys-color-surface-container);
      padding: 14px;
      border-radius: 16px;
      border: 1px solid var(--md-sys-color-outline-variant);
    }
    .add-key-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .input-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--md-sys-color-primary);
    }
    .add-key-row {
      display: flex;
      gap: 10px;
    }
    .add-key-row input {
      flex: 1;
      background-color: var(--md-sys-color-surface-container-high);
      border: 1px solid var(--md-sys-color-outline);
      border-radius: 12px;
      color: var(--md-sys-color-on-surface);
      font-family: 'Roboto Mono', monospace;
      font-size: 13px;
      padding: 9px 12px;
      outline: none;
      transition: border-color 0.2s;
    }
    .add-key-row input:focus {
      border-color: var(--md-sys-color-primary);
    }
    .primary-btn {
      background-color: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      border: none;
      border-radius: 12px;
      padding: 9px 16px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: opacity 0.2s;
      white-space: nowrap;
    }
    .primary-btn:hover { opacity: 0.9; }
    .input-hint {
      font-size: 11px;
      color: var(--md-sys-color-on-surface-variant);
      opacity: 0.8;
    }
    .feedback-msg {
      font-size: 12px;
      min-height: 16px;
    }
    .feedback-msg.success { color: #A8E5A3; }
    .feedback-msg.error { color: var(--md-sys-color-error); }

    /* Utility Toolbar */
    .keys-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 4px;
    }
    .toolbar-title {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--md-sys-color-on-surface-variant);
    }
    .toolbar-buttons {
      display: flex;
      gap: 8px;
    }
    .text-btn, .danger-text-btn {
      background: none;
      border: none;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      border-radius: 8px;
      transition: background-color 0.2s;
    }
    .text-btn {
      color: var(--md-sys-color-primary);
    }
    .text-btn:hover {
      background-color: rgba(208, 188, 255, 0.08);
    }
    .danger-text-btn {
      color: var(--md-sys-color-error);
    }
    .danger-text-btn:hover {
      background-color: rgba(242, 184, 181, 0.08);
    }

    /* Key Items */
    .keys-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 240px;
      overflow-y: auto;
      padding-right: 2px;
    }
    .key-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--md-sys-color-surface-container);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: 12px;
      padding: 10px 14px;
      gap: 10px;
      transition: border-color 0.2s;
    }
    .key-item.current-active {
      border-color: var(--md-sys-color-primary);
      background-color: rgba(79, 55, 139, 0.2);
    }
    .key-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex: 1;
      overflow: hidden;
    }
    .key-header-line {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .key-index {
      font-size: 11px;
      font-weight: 700;
      color: var(--md-sys-color-on-surface-variant);
    }
    .key-status-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 6px;
      text-transform: uppercase;
    }
    .key-status-badge.active {
      background-color: rgba(168, 229, 163, 0.15);
      color: #A8E5A3;
    }
    .key-status-badge.exhausted {
      background-color: var(--md-sys-color-error-container);
      color: var(--md-sys-color-on-error-container);
    }
    .key-status-badge.current {
      background-color: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
    }
    .key-value-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .key-value-text {
      font-family: 'Roboto Mono', monospace;
      font-size: 12px;
      color: var(--md-sys-color-on-surface);
      word-break: break-all;
    }
    .key-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .icon-action-btn {
      background: none;
      border: none;
      color: var(--md-sys-color-on-surface-variant);
      cursor: pointer;
      border-radius: 8px;
      padding: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .icon-action-btn:hover {
      background-color: var(--md-sys-color-surface-variant);
      color: var(--md-sys-color-on-surface);
    }
    .icon-action-btn.delete-btn:hover {
      background-color: var(--md-sys-color-error-container);
      color: var(--md-sys-color-on-error-container);
    }
    .keys-empty {
      text-align: center;
      padding: 30px 10px;
      color: var(--md-sys-color-on-surface-variant);
      font-size: 13px;
    }
  </style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="logo">
      <div class="logo-icon">
        <img src="icons/images.jpg" alt="Luna cool girl" />
      </div>
      <div>
        <div class="logo-title">Luna cool girl</div>
        <div class="logo-sub">designed by inferno</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="keys-btn" id="keysToggleBtn" title="Manage API Keys">
        <span class="material-symbols-rounded" style="font-size: 18px;">key</span>
        <span>Keys</span>
        <span class="keys-badge" id="keysBadge">0</span>
      </button>
      <button class="stop-btn" id="stopBtn">
        <span class="material-symbols-rounded" style="font-size: 18px;">stop_circle</span> Stop
      </button>
    </div>
  </div>

  <div class="page-bar" id="pageBar" title="Click to copy URL">
    <div class="page-sec-badge" id="pageSecBadge">
      <span class="material-symbols-rounded" id="pageSecIcon">lock</span>
    </div>
    <div class="page-url-wrapper">
      <span class="page-domain" id="pageDomain">Loading...</span>
      <span class="page-path-sep" id="pagePathSep" style="display:none;">/</span>
      <span class="page-path" id="pagePath" style="display:none;"></span>
    </div>
    <button class="copy-url-btn" id="copyUrlBtn" title="Copy full URL">
      <span class="material-symbols-rounded" id="copyUrlIcon">content_copy</span>
    </button>
  </div>

  <div class="log-area" id="logArea">
    <div class="log-empty" id="logEmpty">
      <span class="material-symbols-rounded log-empty-icon">quiz</span>
      <div class="log-empty-title">Ready to answer questions.</div>
      <div class="log-empty-subtitle">Navigate to a test and click "Answer All Questions".</div>
    </div>
  </div>

  <div class="thinking" id="thinking">
    <div class="thinking-dots"><span></span><span></span><span></span></div>
    agent is thinking...
  </div>

  <div class="q-range-container">
    <div class="q-input-group">
      <div class="q-label-row">
        <label for="startQ">Start Question:</label>
        <button class="detect-btn" id="detectQBtn" title="Auto-detect current question number on page">
          <span class="material-symbols-rounded">my_location</span> Detect
        </button>
      </div>
      <input type="number" id="startQ" min="1" value="1">
    </div>
    <div class="q-input-group">
      <div class="q-label-row">
        <label for="endQ">End Question:</label>
      </div>
      <input type="number" id="endQ" min="1" value="100">
    </div>
  </div>

  <div class="quick-actions">
    <button class="quick-btn answer-current-btn" data-cmd="Answer this question.">
      <span class="material-symbols-rounded">done</span>
      Answer Current
    </button>
    <button class="quick-btn answer-all-btn" data-cmd="Answer all questions.">
      <span class="material-symbols-rounded">smart_toy</span>
      Answer All
    </button>
  </div>

  <div class="input-row">
    <textarea id="cmdInput" placeholder="Tell me what to do..." rows="1"></textarea>
    <button class="send-btn" id="sendBtn">
      <span class="material-symbols-rounded">send</span>
    </button>
  </div>

  <div class="footer">
    <button class="clear-btn" id="clearBtn">Clear Logs</button>
  </div>

</div>

<!-- API Keys Modal -->
<div class="modal-overlay" id="keysModalOverlay">
  <div class="modal-card">
    <div class="modal-header">
      <div class="modal-title">
        <span class="material-symbols-rounded modal-title-icon">vpn_key</span>
        <span>Groq API Keys</span>
        <span class="keys-count-tag" id="modalKeysCountTag">0 active</span>
      </div>
      <button class="icon-btn-close" id="closeKeysModalBtn" title="Close">
        <span class="material-symbols-rounded">close</span>
      </button>
    </div>

    <div class="modal-body">
      <!-- Add Key Section -->
      <div class="add-key-section">
        <div class="add-key-header">
          <label for="newKeyInput" class="input-label">Add API Key</label>
          <button id="importKeysBtn" class="text-btn" title="Import API keys from a .txt file">
            <span class="material-symbols-rounded" style="font-size: 16px;">upload_file</span> Import .txt
          </button>
        </div>
        <div class="add-key-row">
          <input type="password" id="newKeyInput" placeholder="Paste Groq API Key (gsk_...)" autocomplete="off" />
          <button id="addKeyBtn" class="primary-btn">
            <span class="material-symbols-rounded">add</span> Add
          </button>
        </div>
        <div class="input-hint">Enter single key, paste multiple keys, or import from a .txt file.</div>
        <div id="addKeyFeedback" class="feedback-msg"></div>
      </div>
      <input type="file" id="importKeysInput" accept=".txt,text/plain" style="display: none;" />

      <!-- Utility Toolbar -->
      <div class="keys-toolbar">
        <span class="toolbar-title">Present Keys</span>
        <div class="toolbar-buttons">
          <button id="importKeysBtnToolbar" class="text-btn" title="Import API keys from a .txt file">
            <span class="material-symbols-rounded">upload_file</span> Import .txt
          </button>
          <button id="resetExhaustedBtn" class="text-btn" title="Reset all exhausted flags">
            <span class="material-symbols-rounded">refresh</span> Reset Status
          </button>
          <button id="clearAllKeysBtn" class="danger-text-btn" title="Delete all keys">
            <span class="material-symbols-rounded">delete_forever</span> Clear All
          </button>
        </div>
      </div>

      <!-- Keys List -->
      <div class="keys-list" id="keysListContainer">
        <!-- Dynamically populated -->
      </div>
    </div>
  </div>
</div>

<script src="popup.js"></script>
</body>
</html>
